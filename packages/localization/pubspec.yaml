name: localization
resolution: workspace

description: "Localization (Google Sheets → ARB → gen-l10n via sheety_localization)"

publish_to: none

version: 0.0.1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Generated code imports package:intl (Intl.canonicalizedLocale, select/plural).
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints_tool: ^1.0.1
  # The sheet -> ARB -> gen-l10n pipeline and its round-trip checks; `l10n_tool.json` is the
  # shape it reads. It brings `sheety_localization` and the Sheets client with it.
  l10n_tool:
    git:
      url: https://github.com/zs-dima/l10n_tool.git
      ref: v0.1.1
  # `tool/seed_sheet.dart` and `tool/verify_l10n.dart` write and read the sheet directly.
  googleapis: ^14.0.0
  googleapis_auth: ^2.0.0

flutter:
  # Required by gen-l10n (sheety shells out to it); harmless on pub get — this package has
  # no l10n.yaml and no lib/l10n, so nothing generates outside the explicit sheety run.
  # (The author's 2025 notes said `false`; Flutter 3.47 refuses to generate without it.)
  generate: true
