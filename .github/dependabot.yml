# Dependabot configuration for the pub workspace + GitHub Actions.
# Docs: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
enable-beta-ecosystems: true
updates:
  # NB: the kit (core_model, telemetry, connect_kit, http_kit, lints_tool) arrives by git tag from
  # github.com/zs-dima, and dependabot does not update pub git dependencies (dart-lang/pub#3382);
  # those pins are bumped by hand.
  - package-ecosystem: "pub"
    directories:
      - "/"
      - "/packages/localization"
      - "/packages/model/auth_model"
      - "/packages/tool/core_tool"
      - "/packages/tool/converter/json_converter"
      - "/packages/ui"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: /
    target-branch: "main"
    groups:
      pub-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: /
    target-branch: "main"
