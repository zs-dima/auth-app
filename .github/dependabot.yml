# Dependabot configuration for the pub workspace + GitHub Actions.
# Docs: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
enable-beta-ecosystems: true
updates:
  # NB: packages/vendor/connectrpc is deliberately NOT listed — it is a pinned vendored copy
  # (see its VENDORED.md); dependabot must not bump it.
  - package-ecosystem: "pub"
    directories:
      - "/"
      - "/packages/localization"
      - "/packages/model/core_model"
      - "/packages/model/connect_model"
      - "/packages/model/auth_model"
      - "/packages/model/http_client"
      - "/packages/tool/core_tool"
      - "/packages/tool/lints_tool"
      - "/packages/tool/converter/json_converter"
      - "/packages/ui"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: /
    target-branch: "main"
    groups:
      pub-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: /
    target-branch: "main"
