name: "Code Analysis"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2" # keep in sync with deploy-firebase.yml

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v6

      # The Flutter pin is necessarily duplicated (Docker FROM needs a literal tag, the deploy
      # workflow its own env) — this guard fails the build when any copy drifts from this one.
      - name: 🔒 Check Flutter pins in sync
        run: |
          for f in .github/workflows/deploy-firebase.yml deploy/Dockerfile; do
            grep -q "$FLUTTER_VERSION" "$f" \
              || { echo "::error file=$f::Flutter pin mismatch: expected $FLUTTER_VERSION"; exit 1; }
          done
          if [ -n "${{ vars.FLUTTER_VERSION }}" ] && [ "${{ vars.FLUTTER_VERSION }}" != "$FLUTTER_VERSION" ]; then
            echo "::error::Repo variable FLUTTER_VERSION (${{ vars.FLUTTER_VERSION }}) overrides the deploy image and differs from $FLUTTER_VERSION"
            exit 1
          fi

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install Dependencies
        run: flutter pub get

      # Hand-written sources only: generated output (.g/.freezed/.gen, proto stubs, l10n) keeps its
      # generator's formatting, and packages/vendor keeps its upstream formatting.
      - name: ✨ Check Formatting
        run: |
          git ls-files '*.dart' ':!:packages/vendor/**' \
            | grep -vE '\.(g|freezed|gen)\.dart$|\.pb(enum|json|server)?\.dart$|\.connect\.(client|spec)\.dart$|/generated/' \
            | xargs -r dart format --output=none --set-exit-if-changed

      # Generated Dart (.g/.freezed) is gitignored, so CI must produce it. build_runner only
      # builds the current package in a pub workspace — run it in every member that has it.
      # l10n is NOT generated here: sheety_localization output is committed (CI must not
      # need Google credentials).
      - name: 🦄 Generate Code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          (cd packages/model/auth_model && dart run build_runner build --delete-conflicting-outputs)
          # pubspec.yaml.g.dart is gitignored but imported by lib/ code; its builder is not in
          # build_runner (commented out in build.yaml) — generate it explicitly, after
          # build_runner (same order as deploy/build_flutter_web.sh).
          dart pub global activate pubspec_generator
          dart pub global run pubspec_generator:generate --input pubspec.yaml --output lib/_core/generated/constant/pubspec.yaml.g.dart

      # TODO: tighten to fatal warnings/infos once the pre-existing issues are addressed
      # (19 on 2026-08-29: unused_field, experimental_member_use, avoid_catches_without_on_clauses, …).
      # NB: flutter analyze treats BOTH warnings and infos as fatal by default — errors still fail here.
      - name: 🕵️ Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Install DCM
        uses: CQLabs/setup-dcm@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # version: "1.39.1"

      # TODO: tighten to fatal warnings/style once the pre-existing issues are swept
      # (223 on 2026-08-30: 64 warning + 159 style; DCM errors still fail the step).
      - name: Run DCM
        run: dcm analyze --no-fatal-warnings --no-fatal-style .

      - name: 🧪 Run Tests (workspace)
        run: dart run tool/test_workspace.dart

      # Non-blocking: missing CODECOV_TOKEN or an upload hiccup must not fail the gate.
      - name: 📈 Upload Coverage
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: false

      # No dependabot exclusion: the workflow_run reporter exists exactly so dependabot/fork
      # PRs get a report, and uploading works with the read-only token.
      - name: 📤 Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/
