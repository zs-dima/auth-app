name: "Code Analysis"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # DCM posts its results as a GitHub check

env:
  FLUTTER_VERSION: "3.47.2" # keep in sync with deploy-firebase.yml

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v6

      # The Flutter pin is necessarily duplicated (Docker FROM needs a literal tag, the deploy
      # workflow its own env) — this guard fails the build when any copy drifts from this one.
      - name: 🔒 Check Flutter pins in sync
        run: |
          for f in .github/workflows/deploy-firebase.yml deploy/Dockerfile; do
            grep -q "$FLUTTER_VERSION" "$f" \
              || { echo "::error file=$f::Flutter pin mismatch: expected $FLUTTER_VERSION"; exit 1; }
          done
          if [ -n "${{ vars.FLUTTER_VERSION }}" ] && [ "${{ vars.FLUTTER_VERSION }}" != "$FLUTTER_VERSION" ]; then
            echo "::error::Repo variable FLUTTER_VERSION (${{ vars.FLUTTER_VERSION }}) overrides the deploy image and differs from $FLUTTER_VERSION"
            exit 1
          fi

      - name: 🐦 Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Hand-written sources only: generated output (.g/.freezed/.gen, proto stubs, l10n) keeps its
      # generator's formatting, and packages/vendor keeps its upstream formatting.
      - name: ✨ Check Formatting
        run: |
          git ls-files '*.dart' ':!:packages/vendor/**' \
            | grep -vE '\.(g|freezed|gen)\.dart$|\.pb(enum|json|server)?\.dart$|\.connect\.(client|spec)\.dart$|/generated/' \
            | xargs -r dart format --output=none --set-exit-if-changed

      # Fatal by default (warnings AND infos): the pre-existing issues were swept 2026-09-02.
      # A new info fails the gate — fix it or justify a targeted `// ignore:` in the diff.
      - name: 🕵️ Analyze
        run: flutter analyze

      - name: Install DCM
        uses: CQLabs/setup-dcm@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # version: "1.39.1"

      # TODO: tighten to fatal warnings/style once the pre-existing issues are swept
      # (347 on 2026-09-05: 198 warning + 149 style). DCM ERRORS still fail the step, and
      # `lints_tool` v1.0.1 promoted six layout rules to that severity — the three real hits it
      # found in `packages/ui` are fixed, so the count here is zero and must stay zero.
      - name: Run DCM
        run: dcm analyze --no-fatal-warnings --no-fatal-style .

      - name: 🧪 Run Tests (workspace)
        run: dart run tool/test_workspace.dart

      # Browser-platform tests (ubuntu runners ship Chrome): the web update-check API degrades
      # gracefully without the sw bootstrap — pinned in a real browser, not an emulated one.
      - name: 🌐 Run Web Tests (chrome)
        run: flutter test --platform chrome test/web

      # Non-blocking: missing CODECOV_TOKEN or an upload hiccup must not fail the gate.
      - name: 📈 Upload Coverage
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: false

      # No dependabot exclusion: the workflow_run reporter exists exactly so dependabot/fork
      # PRs get a report, and uploading works with the read-only token.
      - name: 📤 Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/
