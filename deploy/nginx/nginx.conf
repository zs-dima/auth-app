# Mirrors firebase.json's hosting policy (the canonical one — see its Cache-Control comment):
# the Service Worker owns ALL caching (MD5-versioned precache), so the HTTP layer stays out of
# the way with a blanket `Cache-Control: no-cache` — browsers keep files on disk but revalidate
# (304 when unchanged). Per-extension max-age is UNSAFE here: main.dart.js / bootstrap.js /
# MaterialIcons (tree-shaken, stable filename) all mutate between builds under stable URLs; a
# 30d cache on them made a docker deploy permanently un-updatable for returning clients.
#
# Header inheritance trap (why no location{} below declares add_header): a single add_header
# inside a location DROPS every server-level header for that location's responses — the old
# static-cache location silently shipped .js/.css without COEP/COOP, which blocked
# drift_worker.js and silently degraded OPFS. Keep ALL add_header directives at server level;
# `always` keeps them on error responses too.
#
# TLS: terminate at the ingress/CDN in front; HSTS below is effective only over TLS.
# https://ssl-config.mozilla.org/#server=nginx

worker_processes 1;

http {
    include /etc/nginx/mime.types;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        autoindex off;
        charset utf-8;
        server_tokens off;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # Effective only when served over TLS (e.g. behind a TLS-terminating ingress)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # Cross-origin isolation (SharedArrayBuffer / OPFS for the drift database) — parity with firebase.json
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        # The SW owns caching; HTTP revalidates (see the header comment).
        add_header Cache-Control no-cache always;

        location / {
            # SPA fallback (parity with firebase.json rewrites): deep links — an emailed
            # password-reset /recovery?token=... on a cold client — must serve the app shell,
            # not 404. Flutter's router consumes the path client-side.
            try_files $uri /index.html;
        }

        # deny access to files starting with a dot (hidden) or ending with ~ (temp)
        location ~ /\. {
            access_log off;
            log_not_found off;
            deny all;
        }
        location ~ ~$ {
            access_log off;
            log_not_found off;
            deny all;
        }

        gzip on;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_proxied any;
        gzip_min_length 512;
        gzip_types text/plain text/css text/javascript text/xml text/x-component application/javascript application/x-javascript application/json application/wasm application/xml application/xhtml+xml application/manifest+json font/truetype font/opentype font/otf font/ttf image/svg+xml;
    }
}

events {
    worker_connections 1024;
}
