<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- DEV-RELAXED CSP: `flutter run` needs 'unsafe-inline' (DWDS), gstatic (CanvasKit) and ws: (debug service). Strict policy lives in index.prod.html; details in web/README.md. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'">

  <meta name="description" content="Authentication demo app.">
  <meta name="theme-color" content="#f4fdf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta flt-viewport="" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="auth_app">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Authentication demo app | Dev</title>
  <link rel="manifest" href="manifest.json">

</head>
  <body>
    <!-- Called unguarded by Dart JS interop — must exist (prod gets real ones from bootstrap.js). -->
    <script>
      window.updateLoadingProgress = function (progress, text) {};
      window.removeLoadingIndicator = function () {};
    </script>

    <!-- Flutter's default bootstrap -->
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
