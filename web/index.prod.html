<!DOCTYPE html>
<html>

<head>
  <base href="/" />

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- STRICT CSP (XSS → refresh-token defense): all scripts external, no 'unsafe-inline'.
       gstatic stays in script-src ONLY because sw 0.1.5's bootstrap loads CanvasKit CDN-first with
       no opt-out: it fetch-probes gstatic (passes — connect-src allows https:) and then script-loads
       from there; dropping gstatic here would pass the probe and block the script = broken app, NOT
       a fallback to the local canvaskit/ that --no-web-resources-cdn already ships. Drop it when sw
       grows a no-CDN toggle (docs/decisions.md 2026-09-02). Checklist: web/README.md. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'">

  <meta name="description" content="Authentication demo app.">
  <meta name="theme-color" content="#f4fdf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta flt-viewport="" name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="auth_app">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Authentication demo app</title>
  <link rel="manifest" href="manifest.json">
